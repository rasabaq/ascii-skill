name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            uv run --python ${{ matrix.python }} "$t" || { echo "FAILED: $t"; status=1; }
            echo "::endgroup::"
          done
          exit $status
